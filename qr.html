<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemical Safety Sheets QR Sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Printable door sign for the SDS lookup site. Letter paper, portrait.
   The QR code is a static SVG for https://addison-grant.github.io/rcfe-sds-lookup/
   If the site address ever changes, regenerate the QR code. */
@page{size:letter portrait;margin:0.5in}
:root{--ink:#1b1d1f;--soft:#5b6168;--red:#b3261e;--desk:#e9ebee;--desk-ink:#1b1d1f}
@media(prefers-color-scheme:dark){:root{--desk:#121416;--desk-ink:#eceff1}}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif}
.tools{max-width:7.5in;margin:0 auto;padding:20px 16px 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--desk-ink);font-size:15px}
.tools button{font:inherit;font-weight:700;min-height:44px;padding:10px 18px;border-radius:10px;border:2px solid var(--desk-ink);background:var(--desk-ink);color:var(--desk);cursor:pointer}
.tools button:focus-visible{outline:3px solid #8a5a00;outline-offset:2px}
.sheet{container-type:inline-size;width:min(7.5in,calc(100% - 32px));aspect-ratio:7.5/9.8;margin:16px auto 32px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);display:flex;overflow:hidden}
.in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:5cqi 4cqi}
h1{margin:0;font-weight:800;line-height:1.08;letter-spacing:-.01em}
h1 .a{display:block;font-size:7cqi}
h1 .b{display:block;font-size:5.2cqi;font-weight:700;margin-top:1.6cqi}
figure{margin:0}
.qr{display:block;width:80cqi;height:auto;shape-rendering:crispEdges}
.url{margin:0;font-weight:600;font-size:3cqi;color:var(--soft);overflow-wrap:anywhere}
.url a{color:inherit;text-underline-offset:.18em}
.url a:focus-visible{outline:3px solid #8a5a00;outline-offset:2px;border-radius:2px}
.sos{width:100%;border:0.8cqi solid var(--red);border-radius:2.4cqi;padding:2.2cqi 3cqi;display:flex;flex-wrap:wrap;justify-content:center;gap:0.6cqi 6cqi;font-weight:700;font-size:3.8cqi;line-height:1.3;color:var(--ink)}
.sos span{white-space:nowrap}
.sos b{color:var(--red);font-weight:800}
@media print{
  body{background:#fff}
  .tools{display:none}
  .sheet{width:7.5in;height:9.8in;aspect-ratio:auto;margin:0;box-shadow:none;break-inside:avoid}
  .url a{text-decoration:none}
}
</style>
</head>

<div class="tools">
  <button type="button" onclick="window.print()">Print this sign</button>
  <span>Letter paper, portrait, 100% scale. Tape it at eye level on the chemical closet door.</span>
